name: Daily Learning Digest Email & README Update

on:
  schedule:
    # 03:30 UTC = 9:00 AM IST (India Standard Time)
    - cron: '30 3 * * *'
  workflow_dispatch: # Enables a "Run workflow" button for manual testing anytime

jobs:
  send-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Daily Digest Email Script & Update README
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/send_daily_digest.py --send

      - name: Commit and Push Updated README.md
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-update daily developer progress in README [skip ci]" && git push)
